name: Android APK

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'native/**'
      - 'rust/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'test/**'
      - 'flutter_rust_bridge.yaml'
      - 'scripts/build_rust_backend.sh'
      - 'scripts/build_rust_backend.ps1'
      - 'scripts/run_rust_host_tests.sh'
      - 'scripts/run_rust_host_tests.ps1'
      - 'scripts/check_native_alignment.cjs'
      - 'scripts/verify_android_apk.py'
      - 'scripts/verify_audio_cenc.cjs'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  # Pinned flutter_rust_bridge toolchain. The Rust crate, the generated bindings
  # and the codegen binary must all be the same version.
  FRB_VERSION: '2.13.0'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '36.0.0'
  RUST_TARGET: 'aarch64-linux-android'
  # Certificate the release APK must carry. The built APK is compared against
  # this, so a package signed with the wrong key -- or not signed at all --
  # fails here instead of being published. The matching keystore is stored
  # as a repository secret.
  RELEASE_SIGNER_SHA256: 'e8471cd8a935fd71fd8197355b5558d245449d5bc8294f60f88616f60451c550'
  FQAPP_USE_MAVEN_MIRRORS: 'false'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m" -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false

      # The product build has no private backend checkout and no extra
      # toolchain. The golden vectors in rust/testdata/ are checked in and
      # are never an input to this workflow.

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android SDK components
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager_bin" --licenses < <(yes) > /dev/null
          "$sdkmanager_bin" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$NDK_VERSION" >> "$GITHUB_ENV"
          flutter config --android-sdk "$ANDROID_HOME" --no-analytics

      - name: Check the Web assets, audio diagnostics, and Rust build scripts
        run: >-
          node --test test/web_assets_test.cjs
          test/verify_audio_cenc_test.cjs
          test/build_rust_backend_scripts_test.cjs

      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust lints
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests (signing, device crypto, protocol vectors)
        run: cargo test --manifest-path rust/Cargo.toml --locked

      # The host build is what the real Dart -> FRB -> Rust integration tests
      # load; without it those tests are reported as skipped, never as passed.
      - name: Build the host Rust core for the FFI integration tests
        run: cargo build --manifest-path rust/Cargo.toml

      - name: Host FFI integration tests (Dart -> FRB -> Rust, mock upstream)
        run: bash scripts/run_rust_host_tests.sh --skip-build

      - name: Generate the bridge bindings and verify they are reproducible
        run: |
          # Content-hash the generated tree instead of using `git diff`: rust/ and
          # lib/src/ can be untracked in a fresh checkout, where git diff compares
          # nothing at all and the check would silently pass.
          mkdir -p build/ci-artifacts
          digest() {
            find rust/src/frb_generated.rs lib/src/rust -type f -print0 \
              | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1
          }
          before="$(digest)"
          flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
          after="$(digest)"
          printf 'generated bindings digest (before): %s\n' "$before"
          printf 'generated bindings digest (after):  %s\n' "$after"
          if [ "$before" != "$after" ]; then
            echo 'Generated bindings are stale: commit the output of flutter_rust_bridge_codegen.' >&2
            exit 1
          fi
          {
            printf 'bindings_sha256=%s\n' "$after"
          } > build/ci-artifacts/bindings-digest.txt

      - name: Compile the Rust core for Android ARM64
        run: bash scripts/build_rust_backend.sh --skip-codegen

      - name: Check the Android Rust core library
        run: |
          mkdir -p build/ci-artifacts
          so=android/app/src/main/jniLibs/arm64-v8a/libfqapi_core.so
          test -s "$so"
          nm_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm_bin" --dynamic --defined-only "$so" > build/ci-artifacts/rust-core-symbols.txt
          # flutter_rust_bridge entry points must be exported for dart:ffi.
          for symbol in frb_get_rust_content_hash store_dart_post_cobject; do
            if ! grep -Eq "[[:space:]]${symbol}$" build/ci-artifacts/rust-core-symbols.txt; then
              echo "Missing Rust bridge symbol: $symbol" >&2
              exit 1
            fi
          done
          # 16 KiB page alignment is required by Android 15+.
          readelf_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf_bin" -l "$so" > build/ci-artifacts/rust-core-program-headers.txt
          if ! grep -Eq 'LOAD.*0x4000$' build/ci-artifacts/rust-core-program-headers.txt; then
            echo 'Rust core library is not 16 KiB aligned.' >&2
            exit 1
          fi

      - name: Restore the release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing Actions secret RELEASE_$name." >&2
              exit 1
            fi
          done
          umask 077
          signing_path="$RUNNER_TEMP/fqapp-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          actual_signer="$(keytool -exportcert -keystore "$signing_path" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$actual_signer" != "$RELEASE_SIGNER_SHA256" ]]; then
            echo 'The signing secret does not contain the expected release certificate.' >&2
            exit 1
          fi
          {
            printf 'RELEASE_KEYSTORE_FILE=%s\n' "$signing_path"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          printf 'Verified release signing certificate: %s\n' "$actual_signer"

      - name: Check Flutter application
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=2

      - name: Compile ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Test Android runtime boundaries
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Verify APK contents, signing, and 16 KiB alignment
        run: |
          python3 scripts/verify_android_apk.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            --expected-signer-sha256 "$RELEASE_SIGNER_SHA256" \
            --report-dir build/ci-artifacts/verification
          cp build/app/outputs/flutter-apk/app-release.apk build/ci-artifacts/app-release.apk
          {
            printf 'App commit: %s\n' "$GITHUB_SHA"
            printf 'Rust core: fqapi_core (flutter_rust_bridge %s)\n' "$FRB_VERSION"
            printf 'Rust core library SHA-256: '
            sha256sum android/app/src/main/jniLibs/arm64-v8a/libfqapi_core.so
            printf 'Release signer SHA-256: %s\n' "$RELEASE_SIGNER_SHA256"
            printf 'NDK: %s\nCMake: %s\nAndroid Build Tools: %s\n' "$NDK_VERSION" "$CMAKE_VERSION" "$BUILD_TOOLS_VERSION"
            flutter --version
            cargo --version
            rustc --version
            java -version 2>&1
          } > build/ci-artifacts/build-info.txt

      - name: Upload APK and verification reports
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqapp-arm64-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            app/build/ci-artifacts/app-release.apk
            app/build/ci-artifacts/build-info.txt
            app/build/ci-artifacts/rust-core-symbols.txt
            app/build/ci-artifacts/rust-core-program-headers.txt
            app/build/ci-artifacts/verification/*.json
            app/build/ci-artifacts/verification/*.sha256
            app/build/ci-artifacts/verification/*.log

      - name: Retain diagnostics if a build or APK check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fqapp-apk-diagnostics-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/ci-artifacts/rust-core-symbols.txt
            app/build/ci-artifacts/rust-core-program-headers.txt
            app/build/ci-artifacts/verification/*.json
            app/build/ci-artifacts/verification/*.log

      - name: Write download summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            printf '[下载 ARM64 APK 和校验报告](%s)\n\n' "$ARTIFACT_URL"
            printf 'App commit: `%s`  \n' "$GITHUB_SHA"
            printf 'Rust core: `fqapi_core` (flutter_rust_bridge `%s`)\n\n' "$FRB_VERSION"
            printf 'Rust core library SHA-256: `%s`\n\n' \
              "$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libfqapi_core.so | cut -d ' ' -f 1)"
            printf 'Release signer SHA-256: `%s`\n\n' "$RELEASE_SIGNER_SHA256"
            printf '使用正式 release 签名。已验证 Rust 核心库与 APK ZIP 的 16 KiB 对齐；设备播放仍需实测。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fqapp-release.jks"
