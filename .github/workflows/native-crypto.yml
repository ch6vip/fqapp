name: Native crypto

on:
  push:
    paths:
      - 'native/**'
      - 'test/native_*'
      - 'scripts/verify_audio_cenc.cjs'
      - 'test/verify_audio_cenc_test.cjs'
      - 'test/support/cenc_fixture.cjs'
      - 'test/support/native_compile.cjs'
      # The Kotlin JNI wrapper declares the external funs the C bridge
      # implements (native/android/jni_bridge.c); changing its signatures
      # without re-running the JNI tests would silently break the bridge.
      - 'android/app/src/main/kotlin/com/example/shortplay/CryptoNative.kt'
      - '.github/workflows/native-crypto.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'test/native_*'
      - 'scripts/verify_audio_cenc.cjs'
      - 'test/verify_audio_cenc_test.cjs'
      - 'test/support/cenc_fixture.cjs'
      - 'test/support/native_compile.cjs'
      # The Kotlin JNI wrapper declares the external funs the C bridge
      # implements (native/android/jni_bridge.c); changing its signatures
      # without re-running the JNI tests would silently break the bridge.
      - 'android/app/src/main/kotlin/com/example/shortplay/CryptoNative.kt'
      - '.github/workflows/native-crypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compiler and media fixtures tool
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ffmpeg
      - name: C core, malformed input, and real media with sanitizers
        env:
          NATIVE_CC: clang
          NATIVE_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          node --test --test-concurrency=1
          test/native_aes_test.cjs
          test/native_crypto_test.cjs
          test/native_crypto_media_test.cjs
      - name: Execute the real JNI bridge with JDK checks
        env:
          NATIVE_CC: clang
          NATIVE_JNI_REQUIRED: '1'
        run: node --test --test-concurrency=1 test/native_jni_test.cjs
      - name: Check bounded downloads and complete audio diagnostics
        run: node --test test/verify_audio_cenc_test.cjs
